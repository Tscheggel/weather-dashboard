<main class="min-h-screen bg-slate-100 flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-2xl">
    <h1 class="text-3xl font-bold text-slate-800 mb-6 text-center">
      Weather Dashboard
    </h1>

    <div class="flex gap-2 mb-6">
      <input 
        #cityInput 
        type="text" 
        placeholder="Enter City (f.e. Berlin)..." 
        class="flex-1 px-4 py-3 rounded-2xl bg-white border border-slate-200/60 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700"
        (keyup.enter)="fetchWeather(cityInput.value)"
      >
      <button 
        type="button"
        (click)="fetchWeather(cityInput.value)"
        class="px-5 py-3 bg-blue-600 text-white font-medium rounded-2xl shadow-sm hover:bg-blue-700 transition cursor-pointer"
      >
        Search
      </button>
    </div>

    <app-city-map
      [city]="selectedCity()"
      [weatherData]="weatherData()"
      (citySelected)="selectMapCity($event, cityInput)"
    ></app-city-map>

    @if (weatherError(); as error) {
      <p class="mb-4 rounded-xl bg-red-50 p-3 text-sm text-red-700" role="alert">{{ error }}</p>
    }

    @if (weatherData(); as data) {
      <app-weather-card [weatherData]="data"></app-weather-card>
    } @else {
      <div class="rounded-3xl bg-white p-10 text-center shadow-lg border border-slate-200/60">
        <p class="text-slate-400 animate-pulse font-medium">Loading Data...</p>
      </div>
    }
  </div>
</main>
