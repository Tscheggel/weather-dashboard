@if (weatherData) {
  <div class="bg-white rounded-3xl shadow-lg p-6 border border-slate-200/60 backdrop-blur-md">
    
    <div class="flex justify-between items-start mb-4">
      <div>
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Current location</span>
        <h2 class="text-2xl font-bold text-slate-800">{{ weatherData.location.city }}</h2>
      </div>
      <span class="bg-blue-50 text-blue-600 text-xs font-medium px-2.5 py-1 rounded-full">
        Live
      </span>
    </div>

    <!-- Haupt-Temperatur -->
    <div class="flex items-baseline gap-2 my-6">
      <span class="text-6xl font-black text-slate-900">
        {{ weatherData.current.temperature }}
      </span>
      <span class="text-2xl font-bold text-slate-400">°C</span>
    </div>

    <p class="text-slate-600 font-medium capitalize mb-6">
      {{ weatherData.current.description }}
    </p>

    <!-- Zusatz-Infos (Grid) -->
    <div class="grid grid-cols-2 gap-3 pt-4 border-t border-slate-100">
      <div class="bg-slate-50 p-3 rounded-2xl">
        <span class="block text-xs text-slate-400 mb-1">Humidity</span>
        <span class="text-base font-semibold text-slate-700">{{ weatherData.current.humidity }} %</span>
      </div>
      <div class="bg-slate-50 p-3 rounded-2xl">
        <span class="block text-xs text-slate-400 mb-1">Wind speed</span>
        <span class="text-base font-semibold text-slate-700">{{ weatherData.current.wind_speed }} km/h</span>
      </div>
    </div>

  </div>
} @else {
  <div class="bg-white rounded-3xl shadow-lg p-10 text-center border border-slate-200/60">
    <p class="text-slate-400 animate-pulse font-medium">Loading Data...</p>
  </div>
}
